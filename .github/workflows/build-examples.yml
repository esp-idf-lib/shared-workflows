---
name: Build examples

# A reuseable workflow that builds all examples under `examples` in a matrix
# of all posible combinations, targets and esp-idf versins. Does not support
# ESP8266.
#
# Usage:
#
# ---
# name: Build examples
# on:
#   push:
#   # or other events
# jobs:
#   build-examples-from-other-repo:
#     uses: esp-idf-lib/shared-workflows/.github/workflows/build-examples.yml
#
on:
  workflow_call:

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.matrix.outputs.result }}
    steps:
      - name: Build the matrix of targets and esp-idf versions
        # `result` is a JSON array of objects, each having `target` and
        # `esp-idf-version`. The same pair is used by the `build` job.
        #
        # The targets are taken from SUPPORTED_TARGETS in
        # `tools/idf_py_actions/constants.py` of the corresponding ESP-IDF
        # release, exactly what `idf.py --list-targets` prints. A new chip
        # therefore shows up in the matrix without any change in the
        # components. `latest` follows the `master` branch and corresponds to
        # the `espressif/idf:latest` image.
        #
        # Only the list of versions is maintained by hand: add a version here
        # when it is released and its Docker image is available at
        # https://hub.docker.com/r/espressif/idf
        id: matrix
        shell: bash
        run: |
          versions="v5.4 v5.5 v6.0 v6.1 master"
          pairs=$(mktemp)
          for version in ${versions}; do
            name=${version}
            if [ "${version}" = "master" ]; then
              name=latest
            fi
            curl -fsSL \
              "https://raw.githubusercontent.com/espressif/esp-idf/${version}/tools/idf_py_actions/constants.py" \
              | awk '/^SUPPORTED_TARGETS/{found=1} found{print} found&&/\]/{exit}' \
              | grep -o "'esp32[a-z0-9]*'" \
              | tr -d "'" \
              | while read -r target; do
                  echo "{\"target\":\"${target}\",\"esp-idf-version\":\"${name}\"}"
                done >> "${pairs}"
          done
          echo "result=$(jq -sc '.' "${pairs}")" >> "${GITHUB_OUTPUT}"
          jq -sr 'group_by(.["esp-idf-version"])[] | "\(.[0]["esp-idf-version"]): \(length) targets"' \
            "${pairs}" | sort

  build:
    runs-on: ubuntu-latest
    needs:
      - target

    strategy:
      fail-fast: false
      matrix:
        # One job per (target, esp-idf-version) pair supported by that
        # version. No job is scheduled just to be skipped.
        include: ${{ fromJSON(needs.target.outputs.result) }}
        # How to add a new release of esp-idf to the test
        #
        # when adding a new release, make sure that the corresponding ESP-IDF
        # Docker Image is available at:
        # https://hub.docker.com/r/espressif/idf
        #
        # There is another GitHub Actions workflow to test THIS
        # workflow (build-examples-test.yml), which builds two (empty)
        # examples. If the workflow succeeds, it should be fine to merge the
        # change.
        #
        # Below is how to test this workflow with a real comonent. This is NOT
        # strictly required.
        #
        # All the components defaults to `main` branch of this repository so
        # that they use the latest version of the tests (no manual update is
        # necessary).
        #
        # 1. Create a branch, such as `esp-idf-new-version` in this repository
        # 2. Add the new esp-idf-version, such as `v6.1`, and the targets it
        #    supports to the `targets` mapping in the `target` job above. The
        #    targets must match SUPPORTED_TARGETS in
        #    `tools/idf_py_actions/constants.py` of that release (for `latest`,
        #    of the `master` branch).
        # 3. Push the new branch to GitHub
        # 4. Update one of the components (esp_idf_lib_helpers is a good
        #    choice) in a test branch, such as esp-idf-new-version
        #
        # An example:
        # jobs:
        #   build-examples:
        #     uses: esp-idf-lib/shared-workflows/.github/workflows/build-examples.yml@esp-idf-new-version
        #
        # 5. browse the chosen component on GitHub
        # 6. Click [Actions] tab
        # 7. Click [Build docs] in the sidebar at left
        # 8. Click [Run workflow] button
        # 9. Select the branch for the test
        # 10. Click [Run workflow]
        # 11. See if the test suceeds.
        #
        # After successful test, merge `esp-idf-new-version` branch on THIS
        # respository to `main` branch (you may remove `esp-idf-new-version`
        # branch for the chosen component).
        #
        # After this, all the components will use the new version of the test.

    container:
      # use docker container. faster. proven to work. 7m 55s, as of this
      # writing, to finish building two almost empty examples.
      #
      # https://hub.docker.com/r/espressif/idf
      #
      # Other alternatives:
      #
      # install-esp-idf-action; Slow. Broken.
      # https://github.com/espressif/install-esp-idf-action
      #
      # build-esp-idf-projects-action: Slow. Does not support multiple paths
      # (matrix is required to build multiple examples). Does not support
      # arbitrary command execution.
      # https://github.com/espressif/build-esp-idf-projects-action
      image: espressif/idf:${{ matrix.esp-idf-version }}
      env:
        IDF_CLONE_SHALLOW: 1
        IDF_CLONE_SHALLOW_DEPTH: 1

    steps:
      - name: source export.sh
        run: |
          . ${IDF_PATH}/export.sh
          env | grep "IDF_" >> ${GITHUB_ENV}
          echo "PATH=${PATH}" >> ${GITHUB_ENV}
          echo "ESP_IDF_LIB_CI=yes" >> ${GITHUB_ENV}

      - name: Checkout
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Build examples
        shell: bash
        run: |
          EXAMPLES=`find examples -type d -maxdepth 1 -mindepth 1 | sort`
          rc=0
          for EXAMPLE in ${EXAMPLES}; do
            if [ ! -f "${EXAMPLE}/CMakeLists.txt" ]; then
              echo "::notice::Skipping ${EXAMPLE}: no CMakeLists.txt"
              continue
            fi
            if ! (cd "${EXAMPLE}" && idf.py set-target ${{ matrix.target }} && idf.py build); then
              echo "::error::Failed to build ${EXAMPLE}"
              rc=1
            fi
          done
          exit ${rc}

  build-result:
    if: ${{ always() }}
    needs:
      - build
    runs-on: ubuntu-latest
    name: Final result of build matrix
    steps:
      # because it is impossible to "require status check to pass" with
      # dynamic matrix, create a single job to conclude the result. this way,
      # you can require only this status check in branch protection rules.
      - name: Conclude the result of build matrix
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            exit 0
          else
            exit 1
          fi
