---
name: Validate component with validate-esp-idf-lib-component validators

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      result:
    steps:
      - name: Checkout validate-esp-idf-lib-component
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: esp-idf-lib/validate-esp-idf-lib-component
          ref: main

      - name: Setup python
        # v5
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the dependencies
        run: |
          pip install -r requirements.txt

      - name: Checkout the component under test
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: repo
          submodules: recursive

      - name: Validate the repo
        run: |
          pytest -v
